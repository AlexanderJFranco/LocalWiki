
name: Release Local Wiki

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""

          - platform: ubuntu-22.04
            args: ""

          - platform: macos-latest
            args: "--target aarch64-apple-darwin"

          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      # Download the tagged source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Linux dependencies required by Tauri.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils

      # Set up Node.js.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install Rust and macOS build targets.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Cache Rust compilation artifacts.
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Install frontend dependencies.
      - name: Install dependencies
        run: npm ci

      # Build and upload installers to GitHub Releases.
      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Local Wiki ${{ github.ref_name }}"
          releaseBody: |
            Cross-platform release of Local Wiki.

            Available for Windows, macOS, and Linux.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
