
name: Release Local Wiki

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""

          - platform: ubuntu-22.04
            args: ""

          - platform: macos-latest
            args: "--target aarch64-apple-darwin"

          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    # The actual Tauri project is inside local-wiki/.
    # All shell commands run from this directory.
    defaults:
      run:
        working-directory: local-wiki

    steps:
      # ============================================
      # 1. CHECKOUT REPOSITORY
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # 2. INSTALL LINUX DEPENDENCIES
      # ============================================

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils

      # ============================================
      # 3. SETUP NODE.JS
      # ============================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./local-wiki/package-lock.json

      # ============================================
      # 4. SETUP RUST
      # ============================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # ============================================
      # 5. CACHE RUST BUILD ARTIFACTS
      # ============================================

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./local-wiki/src-tauri -> target"

      # ============================================
      # 6. INSTALL FRONTEND DEPENDENCIES
      # ============================================

      - name: Install dependencies
        run: npm ci

      # ============================================
      # 7. BUILD AND UPLOAD INSTALLERS
      # ============================================

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Explicitly point Tauri to the nested project.
          projectPath: ./local-wiki

          tagName: ${{ github.ref_name }}
          releaseName: "Local Wiki ${{ github.ref_name }}"

          releaseBody: |
            Cross-platform release of Local Wiki.

            Available for Windows, macOS, and Linux.

          releaseDraft: true
          prerelease: false

          args: ${{ matrix.args }}
